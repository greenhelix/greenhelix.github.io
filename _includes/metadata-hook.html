{%- comment -%} 데스크톱(850px 이상) 전 구간에서 왼쪽 사이드바를 접고 펴는 둥근 버튼. 850px 미만은 테마 기본 햄버거를 쓴다. {%- endcomment -%}
<style>
  #sidebar-collapse-btn { display: none; }
  @media (min-width: 850px) {
    #sidebar { transition: transform .25s ease; }
    #main-wrapper { transition: margin-left .25s ease; }
    html.sidebar-collapsed #sidebar { transform: translateX(-260px); }
    html.sidebar-collapsed #main-wrapper { margin-left: 0; }
    #sidebar-collapse-btn {
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: .6rem; left: 217px; z-index: 1031;
      width: 2rem; height: 2rem; padding: 0; border-radius: 50%; cursor: pointer;
      color: var(--text-color); background: var(--card-bg, var(--main-bg));
      border: 1px solid var(--btn-border-color, rgba(128,128,128,.4));
      box-shadow: 0 1px 4px rgba(0,0,0,.15); transition: left .25s ease;
    }
    html.sidebar-collapsed #sidebar-collapse-btn { left: .6rem; }
    html.sidebar-collapsed #topbar { padding-left: 2.8rem !important; }
  }
  @media (min-width: 1650px) {
    html.sidebar-collapsed #sidebar { transform: translateX(-300px); }
    #sidebar-collapse-btn { left: 257px; }
    html.sidebar-collapsed #sidebar-collapse-btn { left: .6rem; }
  }
  /* PWA 업데이트 안내 팝업: 화면 아래 가운데의 작은 알약 모양으로 */
  @keyframes kani-toast-in { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #notification.toast.show {
    bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    z-index: 1090; padding: .3rem .4rem .3rem .2rem; border-radius: 999px !important;
    color: var(--text-color); background: var(--card-bg, var(--main-bg));
    border: 1px solid var(--btn-border-color, rgba(128,128,128,.4));
    box-shadow: 0 6px 24px rgba(0,0,0,.22);
    -webkit-animation: kani-toast-in .35s ease-out; animation: kani-toast-in .35s ease-out;
  }
  #notification.toast .toast-body { font-size: .95rem; font-weight: 600; padding-top: .35rem; padding-bottom: .35rem; }
  #notification.toast button[aria-label='Update'] { font-size: .85rem; padding: .25rem .8rem; border-radius: 999px !important; }
</style>
<script>
  (function () {
    var KEY = 'sidebar-collapsed';
    try { if (localStorage.getItem(KEY) === '1') document.documentElement.classList.add('sidebar-collapsed'); } catch (e) {}
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'sidebar-collapse-btn';
      btn.setAttribute('aria-label', 'Toggle sidebar');
      btn.innerHTML = '<i class="fas fa-bars fa-fw"></i>';
      btn.addEventListener('click', function () {
        var on = document.documentElement.classList.toggle('sidebar-collapsed');
        try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
      });
      document.body.appendChild(btn);
      /* 업데이트 팝업 문구를 한국어로 (버튼 동작에 쓰이는 aria-label은 건드리지 않는다) */
      var body = document.querySelector('#notification .toast-body');
      var upd = document.querySelector('#notification button[aria-label="Update"]');
      if (body) body.textContent = '새 내용이 있어요';
      if (upd) upd.textContent = '새로고침';
    });
  })();
</script>
