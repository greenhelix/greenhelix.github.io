{%- comment -%} 데스크톱(850px 이상) 전 구간에서 왼쪽 사이드바를 접고 펴는 둥근 버튼. 850px 미만은 테마 기본 햄버거를 쓴다. {%- endcomment -%}
<style>
  #sidebar-collapse-btn { display: none; }
  @media (min-width: 850px) {
    #sidebar { transition: transform .25s ease; }
    #main-wrapper { transition: margin-left .25s ease; }
    html.sidebar-collapsed #sidebar { transform: translateX(-260px); }
    html.sidebar-collapsed #main-wrapper { margin-left: 0; }
    #sidebar-collapse-btn {
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: .6rem; left: 268px; z-index: 1031;
      width: 2rem; height: 2rem; padding: 0; border-radius: 50%; cursor: pointer;
      color: var(--text-color); background: var(--card-bg, var(--main-bg));
      border: 1px solid var(--btn-border-color, rgba(128,128,128,.4));
      box-shadow: 0 1px 4px rgba(0,0,0,.15); transition: left .25s ease;
    }
    html.sidebar-collapsed #sidebar-collapse-btn { left: .6rem; }
  }
  @media (min-width: 1650px) {
    html.sidebar-collapsed #sidebar { transform: translateX(-300px); }
    #sidebar-collapse-btn { left: 308px; }
    html.sidebar-collapsed #sidebar-collapse-btn { left: .6rem; }
  }
</style>
<script>
  (function () {
    var KEY = 'sidebar-collapsed';
    try { if (localStorage.getItem(KEY) === '1') document.documentElement.classList.add('sidebar-collapsed'); } catch (e) {}
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'sidebar-collapse-btn';
      btn.setAttribute('aria-label', 'Toggle sidebar');
      btn.innerHTML = '<i class="fas fa-bars fa-fw"></i>';
      btn.addEventListener('click', function () {
        var on = document.documentElement.classList.toggle('sidebar-collapsed');
        try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
      });
      document.body.appendChild(btn);
    });
  })();
</script>
